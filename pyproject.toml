[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "apix"
version = "0.1.0"
description = "A command line utility to make working with APIs as easy as running a command"
readme = "README.md"
authors = [
    {name = "apix"}
]
license = "MIT"
requires-python = ">=3.9"
dependencies = [
    "click>=8.0",
    "pyyaml>=6.0",
    "httpx>=0.24",
    "jinja2>=3.0",
    "jq>=1.0",
]

[project.scripts]
apix = "apix.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["apix*"]